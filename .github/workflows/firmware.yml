name: Firmware build

on:
  push:
    paths:
      - '.github/workflows/firmware.yml'
      - 'SEEED/**'
      - 'tests/**'
      - 'tools/**'
  pull_request:
    paths:
      - '.github/workflows/firmware.yml'
      - 'SEEED/**'
      - 'tests/**'
      - 'tools/**'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: '1.5.1'
  SEEED_SAMD_VERSION: '1.8.6'
  U8G2_VERSION: '2.36.19'
  SHIFTREGISTER_VERSION: '1.3.1'
  UF2_COMMIT: '90e9741f217f5a40c98ba74d663e408041037578'
  SEEED_BOARD_INDEX: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
  FQBN: Seeeduino:samd:seeed_XIAO_m0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - name: Check out firmware
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run host regression tests
        run: |
          python3 tests/test_keyboard_events.py
          python3 -m unittest discover -s tests -p 'test_firmware_artifacts.py' -v

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Install board package and libraries
        run: |
          arduino-cli core update-index --additional-urls "$SEEED_BOARD_INDEX"
          arduino-cli core install "Seeeduino:samd@$SEEED_SAMD_VERSION" --additional-urls "$SEEED_BOARD_INDEX"
          arduino-cli lib update-index
          arduino-cli lib install "U8g2@$U8G2_VERSION" "ShiftRegister74HC595@$SHIFTREGISTER_VERSION"

      - name: Compile using the USB library from this checkout
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --library "$GITHUB_WORKSPACE/SEEED/C64_USB_Host_Library_SAMD" \
            --output-dir "$GITHUB_WORKSPACE/build" \
            "$GITHUB_WORKSPACE/SEEED/C128_keyboard"

      - name: Check out the pinned official UF2 converter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/uf2
          ref: ${{ env.UF2_COMMIT }}
          path: .ci/uf2
          persist-credentials: false

      - name: Package and verify firmware
        id: package
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          python3 tools/firmware_artifacts.py \
            --uf2conv .ci/uf2/utils/uf2conv.py \
            --release-tag "$RELEASE_TAG"

      - name: Upload firmware build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the verified firmware build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Attach firmware files to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
